# 世界时钟壁纸设置（修改后保存，重启程序生效）
# 时区 TimeZone：填 Windows 时区 ID
#   英国伦敦 = GMT Standard Time（自动切换冬令时/夏令时）
#   中国北京 = China Standard Time
#   日本东京 = Tokyo Standard Time
#   美国纽约 = Eastern Standard Time
#   世界标准时 = UTC
TimeZone=GMT Standard Time

# 国家标签 Country：2 位国家/地区简称，显示在日期上方
#   例如 UK 英国、CN 中国、JP 日本、US 美国，留空则不显示
Country=UK

# 城市标签 City：主要城市，与国家组合显示为 “UK · LONDON”，留空则只显示国家
City=LONDON
